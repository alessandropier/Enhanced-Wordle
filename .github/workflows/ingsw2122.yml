name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Permessi di esecuzione per Gradle
      run: chmod +x ./gradlew

    - name: Esegui Test (JUnit & JaCoCo) e Compila Progetto
      run: ./gradlew build -x checkstyleMain -x checkstyleTest

    - name: Genera il report di copertura JaCoCo
      run: ./gradlew jacocoTestReport

    - name: Crea la Release e carica il file .jar Eseguibile
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/*-all.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}